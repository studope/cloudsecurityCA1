# ============================================================
# /etc/httpd/conf.d/security-hardening.conf
# Hardening for store.opechimil.online (WordPress on Apache/Amazon Linux)
# Fixes ZAP: CSP, clickjacking, X-Content-Type-Options, HSTS, cookie flags,
# CORS wildcard, server version leak. Requires mod_headers.
# ============================================================

# ---- Hide Apache version (Server Leaks Version Information) ----
ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    # Clickjacking
    Header always set X-Frame-Options "SAMEORIGIN"
    # MIME sniffing
    Header always set X-Content-Type-Options "nosniff"
    # HSTS. Sent unconditionally because TLS is terminated upstream (edge/LB),
    # so the origin sees HTTP and %{HTTPS} is 'off'. Browsers ignore HSTS
    # received over plain HTTP, so this is safe and still reaches the browser
    # over the edge's HTTPS connection.
    # includeSubDomains intentionally omitted: applies to the apex host only,
    # so subdomains are not forced to HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000"
    # Referrer leakage
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Content-Security-Policy. 'unsafe-inline' retained for Astra/Elementor inline
    # assets. Start in Report-Only (below), then switch to enforcing once verified.
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
    # To test safely first, comment the line above and uncomment this one:
    # Header always set Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

    # Remove the wildcard CORS header (Cross-Domain Misconfiguration)
    Header always unset Access-Control-Allow-Origin

    # Cookie flags (Secure / HttpOnly / SameSite).
    # NOTE: no 'always' here on purpose -- application (PHP/WordPress) cookies
    # live in headers_out, which "Header edit" targets; "Header always edit"
    # targets err_headers_out and would miss them.
    Header edit Set-Cookie ^(.*)$ "$1; HttpOnly; Secure; SameSite=Lax"

    # Strip tech fingerprint
    Header always unset X-Powered-By
</IfModule>

# ---- Disable directory listing (uploads listing enabled) ----
<Directory "/var/www/html">
    Options -Indexes
</Directory>

# ---- Block PHP execution in uploads (defence-in-depth) ----
<Directory "/var/www/html/wp-content/uploads">
    <FilesMatch "\.(php|php5|php7|phtml)$">
        Require all denied
    </FilesMatch>
</Directory>

# ---- Block sensitive files (readme/license version disclosure, xmlrpc) ----
<Files "readme.html">
    Require all denied
</Files>
<Files "license.txt">
    Require all denied
</Files>
<Files "xmlrpc.php">
    Require all denied
</Files>
